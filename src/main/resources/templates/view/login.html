<!DOCTYPE html>
<html lang="id" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta th:name="_csrf" th:content="${_csrf.token}">
    <meta th:name="_csrf_header" th:content="${_csrf.headerName}">
    <link rel="icon" type="image/png" th:href="@{/images/logo.png}">
    <title>Login Resepsionis - Monster Inn</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&family=VT323&family=Pixelify+Sans:wght@400..700&display=swap" rel="stylesheet">
    <style>
        *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
        :root {
            --bg-night: #0f0b14;
            --bg-deep: #1e1825;
            --bg-darker: #050208;
            --parchment: #f4e8d0;
            --parchment-soft: #e4d6b8;
            --wood-dark: #3a2e28;
            --wood-mid: #6b4e3a;
            --wood-light: #8a6d4f;
            --roof-dark: #2b151d;
            --roof-mid: #6f2c31;
            --gold: #d4a94a;
            --gold-dark: #a57f2a;
            --gold-bright: #ffd96b;
            --fire: #e8734a;
            --fire-glow: #ffb570;
            --magic: #9c7ac4;
            --magic-glow: #c9a8f0;
            --earth: #85a67a;
            --ink: #120b08;
        }
        body {
            min-height: 100vh;
            padding: clamp(20px, 4vw, 48px);
            display: grid;
            place-items: center;
            overflow-x: hidden;
            color: var(--parchment);
            font-family: 'Pixelify Sans', system-ui, sans-serif;
            image-rendering: pixelated;
            background:
                radial-gradient(circle at 18% 18%, rgba(156,122,196,0.22), transparent 28rem),
                radial-gradient(circle at 80% 12%, rgba(255,217,107,0.13), transparent 24rem),
                radial-gradient(ellipse at 50% 100%, rgba(212,169,74,0.12), transparent 42rem),
                linear-gradient(180deg, #1e1825 0%, #0a0608 100%);
        }
        .stars,
        .stars::before,
        .stars::after {
            position: fixed;
            inset: 0;
            pointer-events: none;
            z-index: 0;
        }
        .stars::before,
        .stars::after {
            content: '';
            background-image:
                radial-gradient(1px 1px at 8% 14%, #fff, transparent),
                radial-gradient(2px 2px at 41% 28%, var(--gold-bright), transparent),
                radial-gradient(1px 1px at 58% 79%, #fff, transparent),
                radial-gradient(2px 2px at 88% 56%, var(--magic-glow), transparent),
                radial-gradient(1px 1px at 22% 67%, #fff, transparent),
                radial-gradient(1px 1px at 74% 12%, #fff, transparent),
                radial-gradient(1px 1px at 16% 49%, #fff, transparent),
                radial-gradient(2px 2px at 66% 41%, var(--gold), transparent);
            opacity: 0.8;
            animation: twinkle 5.5s infinite ease-in-out;
        }
        .stars::after { transform: scale(1.35); opacity: 0.42; animation-duration: 8s; animation-direction: reverse; }
        @keyframes twinkle { 0%,100% { opacity: .32; } 50% { opacity: 1; } }
        @keyframes arrowBounce { 0%,100% { transform: translateX(0); } 50% { transform: translateX(5px); } }
        @keyframes moonPulse { 0%,100% { filter: brightness(.96); box-shadow: 0 0 28px rgba(255,217,107,.38), 0 0 82px rgba(156,122,196,.34), inset -12px -14px 0 rgba(92,66,117,.25); } 50% { filter: brightness(1.08); box-shadow: 0 0 38px rgba(255,217,107,.5), 0 0 105px rgba(156,122,196,.45), inset -12px -14px 0 rgba(92,66,117,.22); } }
        @keyframes glowPulse { 0%,100% { filter: brightness(.92); } 50% { filter: brightness(1.18); } }
        @keyframes flame { 0%,100% { opacity:.82; transform: scaleY(.94); } 50% { opacity:1; transform: scaleY(1.08); } }
        @keyframes cardRise { from { opacity: 0; transform: translateY(20px); } to { opacity: 1; transform: translateY(0); } }

        .login-shell {
            position: relative;
            z-index: 10;
            width: min(1120px, 100%);
            min-height: min(760px, calc(100vh - 64px));
            display: grid;
            grid-template-columns: minmax(360px, 1.08fr) minmax(340px, .92fr);
            gap: clamp(34px, 6vw, 76px);
            align-items: center;
        }

        .art-section {
            position: relative;
            min-height: clamp(420px, 55vw, 560px);
            display: grid;
            place-items: center;
            isolation: isolate;
        }
        .art-aura {
            position: absolute;
            width: min(84%, 480px);
            aspect-ratio: 1.25;
            bottom: 40px;
            border-radius: 50%;
            background:
                radial-gradient(ellipse at 50% 55%, rgba(255,217,107,.14), transparent 58%),
                radial-gradient(ellipse at 50% 30%, rgba(156,122,196,.28), transparent 66%);
            filter: blur(2px);
            z-index: 0;
        }
        .login-moon {
            position: absolute;
            top: 52px;
            right: clamp(26px, 11vw, 112px);
            width: clamp(118px, 15vw, 168px);
            aspect-ratio: 1;
            border-radius: 50%;
            background:
                radial-gradient(circle at 32% 28%, rgba(255,255,255,.9) 0 7%, transparent 8%),
                radial-gradient(circle at 63% 38%, rgba(111,86,132,.24) 0 11%, transparent 12%),
                radial-gradient(circle at 72% 65%, rgba(111,86,132,.22) 0 8%, transparent 9%),
                radial-gradient(circle at 40% 36%, #fff7ca 0%, #f1d98b 49%, #d0aa60 76%, #8f71a3 100%);
            box-shadow: 0 0 28px rgba(255,217,107,.38), 0 0 82px rgba(156,122,196,.34), inset -12px -14px 0 rgba(92,66,117,.25);
            animation: moonPulse 4.8s ease-in-out infinite;
            z-index: 1;
        }
        .login-moon::before {
            content: '';
            position: absolute;
            top: 26%; left: 20%; width: 12%; height: 12%;
            border-radius: 50%;
            background: rgba(111,86,132,.2);
            box-shadow: 46px 24px 0 8px rgba(111,86,132,.18), 20px 68px 0 4px rgba(111,86,132,.2), 72px 72px 0 3px rgba(255,247,202,.36);
        }
        .inn-shadow {
            position: absolute;
            left: 10%; right: 10%; bottom: 48px;
            height: 28px;
            background: radial-gradient(ellipse, rgba(0,0,0,.62), rgba(0,0,0,.22) 58%, transparent 72%);
            z-index: 2;
        }
        .mi-inn {
            position: relative;
            width: min(92vw, 420px);
            height: 285px;
            margin-top: 84px;
            z-index: 3;
            filter: drop-shadow(13px 13px 0 rgba(0,0,0,.48));
        }
        .mi-inn-chimney {
            position: absolute;
            top: 0; left: 22%; width: 39px; height: 90px;
            border: 5px solid var(--ink);
            background: repeating-linear-gradient(0deg, var(--wood-light) 0 12px, var(--wood-dark) 12px 18px);
            z-index: 2;
        }
        .mi-inn-chimney::before { content: ''; position: absolute; left: -8px; right: -8px; top: -13px; height: 14px; border: 5px solid var(--ink); background: var(--gold-dark); }
        .mi-inn-roof-back {
            position: absolute;
            top: 54px; left: 14%; right: 14%; height: 88px;
            border: 5px solid var(--ink);
            background: linear-gradient(180deg, #4d2330, var(--roof-dark));
            clip-path: polygon(0 100%, 18% 28%, 36% 28%, 50% 0, 64% 28%, 82% 28%, 100% 100%);
            z-index: 3;
        }
        .mi-inn-roof {
            position: absolute;
            top: 100px; left: 0; right: 0; height: 102px;
            border: 5px solid var(--ink);
            background: linear-gradient(180deg, #8a3f35 0 37%, var(--roof-mid) 38% 67%, #4d1d27 68% 100%);
            clip-path: polygon(0 67%, 12% 24%, 31% 24%, 50% 0, 69% 24%, 88% 24%, 100% 67%, 94% 100%, 6% 100%);
            z-index: 6;
        }
        .mi-inn-roof::before {
            content: '';
            position: absolute; inset: 12px 22px 20px;
            background: repeating-linear-gradient(0deg, rgba(255,217,107,.13) 0 3px, transparent 3px 16px), repeating-linear-gradient(90deg, rgba(0,0,0,.18) 0 24px, transparent 24px 48px);
        }
        .mi-inn-roof::after {
            content: '';
            position: absolute; left: 7%; right: 7%; bottom: -2px; height: 15px;
            background: repeating-linear-gradient(90deg, var(--gold) 0 18px, var(--gold-dark) 18px 32px);
            border-top: 4px solid var(--ink);
        }
        .mi-inn-body {
            position: absolute;
            left: 13%; right: 13%; bottom: 28px; height: 132px;
            border: 5px solid var(--ink);
            background: linear-gradient(90deg, rgba(255,217,107,.09) 0 2px, transparent 2px 30px), repeating-linear-gradient(90deg, var(--wood-mid) 0 22px, #4a382d 22px 44px);
            z-index: 5;
        }
        .mi-inn-body::before { content: ''; position: absolute; left: -5px; right: -5px; top: 17px; height: 13px; background: #2f211d; border-top: 3px solid var(--ink); border-bottom: 3px solid var(--ink); }
        .mi-inn-body::after { content: ''; position: absolute; left: -12%; right: -12%; bottom: -22px; height: 22px; border: 5px solid var(--ink); background: repeating-linear-gradient(90deg, #5a4534 0 24px, var(--wood-dark) 24px 48px); }
        .mi-beam { position: absolute; top: 0; bottom: 0; width: 13px; background: #2f211d; border-left: 3px solid var(--ink); border-right: 3px solid var(--ink); z-index: 1; }
        .mi-beam.left { left: 16%; } .mi-beam.center { left: 50%; transform: translateX(-50%); } .mi-beam.right { right: 16%; }
        .mi-window {
            position: absolute; top: 47px; width: 62px; height: 44px;
            border: 5px solid var(--ink);
            background: linear-gradient(90deg, transparent 44%, #5c341f 44% 56%, transparent 56%), linear-gradient(0deg, transparent 44%, #5c341f 44% 56%, transparent 56%), radial-gradient(circle at 50% 56%, #fff0a8 0%, var(--gold-bright) 48%, var(--fire) 100%);
            box-shadow: 0 0 22px rgba(255,181,112,.68);
            animation: glowPulse 2.8s ease-in-out infinite;
            z-index: 3;
        }
        .mi-window.one { left: 30px; }
        .mi-window.two { right: 30px; animation-delay: .9s; }
        .mi-door {
            position: absolute; left: 50%; bottom: -1px; width: 82px; height: 86px;
            transform: translateX(-50%);
            border: 5px solid var(--ink); border-bottom: 0;
            background: radial-gradient(circle at 75% 53%, var(--gold-bright) 0 4px, transparent 5px), linear-gradient(90deg, #24160f 0 46%, #100908 46% 54%, #2f1e14 54% 100%);
            z-index: 4;
        }
        .mi-door::before { content: ''; position: absolute; left: 14px; right: 14px; top: 11px; height: 14px; border: 3px solid var(--ink); background: rgba(255,217,107,.22); }
        .mi-signboard {
            position: absolute; left: 50%; top: 155px; width: 92px; height: 34px;
            transform: translateX(-50%);
            display: grid; place-items: center;
            border: 5px solid var(--ink);
            background: linear-gradient(180deg, var(--gold-bright), var(--gold));
            color: var(--wood-dark);
            font-family: 'Press Start 2P', monospace;
            font-size: 8px; letter-spacing: 2px;
            box-shadow: 5px 5px 0 rgba(0,0,0,.38);
            z-index: 8;
        }
        .mi-signboard::before { content: ''; position: absolute; top: -20px; left: 18px; width: 5px; height: 18px; background: var(--ink); box-shadow: 46px 0 0 var(--ink); }
        .mi-lantern {
            position: absolute; top: 82px; width: 17px; height: 27px;
            border: 3px solid var(--ink);
            background: radial-gradient(circle at 50% 60%, #fff0a8 0%, var(--gold-bright) 42%, var(--fire) 100%);
            box-shadow: 0 0 18px rgba(255,181,112,.78);
            animation: flame .9s steps(2,end) infinite;
            z-index: 5;
        }
        .mi-lantern::before { content: ''; position: absolute; top: -12px; left: 3px; width: 7px; height: 10px; border-top: 3px solid var(--ink); border-left: 3px solid var(--ink); border-right: 3px solid var(--ink); }
        .mi-lantern.left { left: 36%; }
        .mi-lantern.right { right: 36%; animation-delay: .35s; }
        .art-caption {
            position: absolute;
            bottom: 0;
            left: 50%;
            transform: translateX(-50%);
            width: max-content;
            max-width: 90%;
            padding: 8px 12px;
            border: 3px solid rgba(212,169,74,.74);
            background: rgba(5,2,8,.74);
            color: var(--parchment-soft);
            font-family: 'Press Start 2P', monospace;
            font-size: 8px;
            line-height: 1.7;
            text-align: center;
            box-shadow: 5px 5px 0 rgba(0,0,0,.35);
        }

        .login-card {
            position: relative;
            padding: clamp(28px, 4vw, 44px);
            border: 5px solid var(--gold);
            background:
                linear-gradient(rgba(244,232,208,.035) 0 0) top left / 100% 10px no-repeat,
                radial-gradient(circle at 50% 0%, rgba(156,122,196,.18), transparent 48%),
                rgba(18,12,24,.96);
            box-shadow: 10px 10px 0 rgba(0,0,0,.58), inset 0 0 0 4px rgba(5,2,8,.9);
            animation: cardRise .55s ease-out both;
        }
        .login-card::before,
        .login-card::after { content: ''; position: absolute; width: 30px; height: 30px; border-color: var(--gold-bright); pointer-events: none; }
        .login-card::before { top: 10px; left: 10px; border-top: 4px solid; border-left: 4px solid; }
        .login-card::after { right: 10px; bottom: 10px; border-right: 4px solid; border-bottom: 4px solid; }
        .login-card-header { text-align: center; margin-bottom: 28px; }
        .logo-box {
            width: 70px; height: 70px;
            margin: 0 auto 18px;
            display: grid; place-items: center;
            border: 4px solid var(--gold-bright);
            background: radial-gradient(circle at 50% 42%, rgba(156,122,196,.28), transparent 58%), var(--bg-darker);
            box-shadow: 6px 6px 0 #000, 0 0 24px rgba(255,217,107,.18);
        }
        .logo-box span { font-family: 'Press Start 2P', monospace; font-size: 16px; color: var(--gold-bright); text-shadow: 2px 2px 0 var(--wood-dark); }
        .kicker {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            padding: 8px 14px;
            border: 2px solid var(--magic);
            background: rgba(156,122,196,.15);
            color: var(--magic-glow);
            font-family: 'Press Start 2P', monospace;
            font-size: 8px;
            line-height: 1.7;
            letter-spacing: 2px;
            text-shadow: 1px 1px 0 #000;
            margin-bottom: 18px;
        }
        .kicker::before,
        .kicker::after { content: '*'; color: var(--gold-bright); }
        .login-title {
            color: var(--gold-bright);
            font-family: 'Press Start 2P', monospace;
            font-size: clamp(18px, 2.4vw, 26px);
            line-height: 1.35;
            text-shadow: 3px 3px 0 var(--wood-dark), 0 0 22px rgba(255,217,107,.2);
            margin-bottom: 12px;
        }
        .login-sub {
            max-width: 360px;
            margin: 0 auto;
            color: var(--parchment-soft);
            font-family: 'VT323', monospace;
            font-size: 23px;
            line-height: 1.15;
        }
        .field-group { margin-bottom: 18px; }
        label {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 12px;
            color: var(--gold-bright);
            font-family: 'Press Start 2P', monospace;
            font-size: 9px;
            line-height: 1.7;
            letter-spacing: 1px;
            text-transform: uppercase;
            margin-bottom: 9px;
        }
        label::after { content: ''; flex: 1; height: 2px; background: repeating-linear-gradient(90deg, rgba(212,169,74,.5) 0 8px, transparent 8px 14px); }
        .pixel-input {
            width: 100%;
            min-height: 56px;
            padding: 13px 16px;
            outline: none;
            border: 4px solid var(--wood-dark);
            background: linear-gradient(180deg, rgba(5,2,8,.92), rgba(15,11,20,.98));
            color: var(--parchment);
            font-family: 'VT323', monospace;
            font-size: 24px;
            letter-spacing: 1px;
            box-shadow: inset 4px 4px 0 rgba(0,0,0,.35);
            transition: border-color .15s, box-shadow .15s, transform .15s;
        }
        .pixel-input::placeholder { color: rgba(244,232,208,.42); }
        .pixel-input:focus {
            border-color: var(--gold-bright);
            box-shadow: inset 4px 4px 0 rgba(0,0,0,.35), 0 0 0 4px rgba(212,169,74,.18), 5px 5px 0 rgba(0,0,0,.35);
            transform: translate(-1px, -1px);
        }
        .mi-btn {
            width: 100%;
            min-height: 60px;
            display: inline-flex;
            justify-content: center;
            align-items: center;
            gap: 12px;
            padding: 16px 20px;
            margin-top: 8px;
            border: 5px solid var(--wood-dark);
            background: linear-gradient(180deg, #ffe89a 0%, var(--gold-bright) 45%, var(--gold) 100%);
            color: var(--wood-dark);
            box-shadow: 6px 6px 0 rgba(0,0,0,.55);
            font-family: 'Press Start 2P', monospace;
            font-size: 10px;
            line-height: 1.65;
            text-transform: uppercase;
            cursor: pointer;
            transition: transform .1s, box-shadow .1s, filter .1s;
        }
        .mi-btn:hover { transform: translate(-2px,-2px); box-shadow: 8px 8px 0 rgba(0,0,0,.55); filter: brightness(1.04); }
        .mi-btn:active { transform: translate(2px,2px); box-shadow: 3px 3px 0 rgba(0,0,0,.55); }
        .mi-arrow { display: inline-block; animation: arrowBounce 1s infinite; }
        .alert-error,
        .alert-success {
            padding: 13px 16px;
            margin-bottom: 18px;
            text-align: center;
            box-shadow: 5px 5px 0 rgba(0,0,0,.34);
        }
        .alert-error { border: 4px solid var(--fire); background: rgba(232,115,74,.16); }
        .alert-success { border: 4px solid var(--earth); background: rgba(133,166,122,.16); }
        .alert-error p,
        .alert-success p { font-family: 'VT323', monospace; font-size: 22px; line-height: 1.2; }
        .alert-error p { color: #ffb99f; }
        .alert-success p { color: #b5d4a8; }
        .back-link {
            display: block;
            margin-top: 24px;
            padding-top: 20px;
            border-top: 3px dashed rgba(212,169,74,.45);
            color: var(--magic-glow);
            font-family: 'VT323', monospace;
            font-size: 21px;
            line-height: 1.2;
            text-align: center;
            text-decoration: none;
            transition: color .15s, transform .15s;
        }
        .back-link:hover { color: var(--gold-bright); transform: translateY(-1px); }

        @media (max-width: 860px) {
            body { padding: 18px; align-items: start; }
            .login-shell { min-height: auto; grid-template-columns: 1fr; gap: 26px; padding: 24px 0; }
            .art-section { min-height: 290px; }
            .login-moon { top: 12px; right: calc(50% - 130px); width: 92px; }
            .mi-inn { width: min(90vw, 310px); height: 215px; margin-top: 48px; }
            .mi-inn-chimney { width: 30px; height: 66px; border-width: 4px; }
            .mi-inn-roof-back { top: 40px; height: 66px; border-width: 4px; }
            .mi-inn-roof { top: 76px; height: 78px; border-width: 4px; }
            .mi-inn-body { bottom: 22px; height: 102px; border-width: 4px; }
            .mi-window { top: 37px; width: 44px; height: 33px; border-width: 4px; }
            .mi-window.one { left: 22px; } .mi-window.two { right: 22px; }
            .mi-door { width: 62px; height: 66px; border-width: 4px; }
            .mi-signboard { top: 116px; width: 74px; height: 29px; border-width: 4px; }
            .mi-lantern { top: 62px; }
            .inn-shadow { bottom: 28px; }
            .art-caption { display: none; }
        }
        @media (max-width: 460px) {
            body { padding: 12px; }
            .login-shell { padding-top: 12px; gap: 18px; }
            .art-section { min-height: 245px; }
            .login-card { padding: 26px 18px; }
            .login-title { font-size: 17px; }
            .login-sub { font-size: 21px; }
            .mi-btn { font-size: 9px; }
        }
        @media (prefers-reduced-motion: reduce) {
            *, *::before, *::after { animation: none !important; transition: none !important; }
        }
    </style>
</head>
<body data-page="login" data-music-scope="lobby">

    <div style="position:fixed;right:18px;bottom:18px;z-index:120;">
        <button id="music-toggle"
                data-mi-music-toggle
                data-label-on="Lagu Lobi: ON"
                data-label-off="Lagu Lobi: OFF"
                type="button" aria-pressed="false" aria-label="Aktifkan lagu lobi"
                style="padding:9px 11px;border:3px solid var(--wood-dark);background:var(--gold);color:var(--wood-dark);box-shadow:4px 4px 0 rgba(0,0,0,.45);font-family:monospace;font-size:10px;line-height:1;cursor:pointer;image-rendering:pixelated;z-index:120;position:relative;">
            Lagu Lobi: OFF
        </button>
    </div>


    <div class="stars"></div>

    <main class="login-shell" aria-label="Login Monster Inn">
        <section class="art-section" aria-hidden="true">
            <div class="art-aura"></div>
            <div class="login-moon"></div>
            <div class="inn-shadow"></div>
            <div class="mi-inn">
                <div class="mi-inn-chimney"></div>
                <div class="mi-inn-roof-back"></div>
                <div class="mi-inn-roof"></div>
                <div class="mi-inn-body">
                    <div class="mi-beam left"></div>
                    <div class="mi-beam center"></div>
                    <div class="mi-beam right"></div>
                    <div class="mi-window one"></div>
                    <div class="mi-window two"></div>
                    <div class="mi-door"></div>
                    <div class="mi-lantern left"></div>
                    <div class="mi-lantern right"></div>
                </div>
                <div class="mi-signboard">INN</div>
            </div>
            <p class="art-caption">FRONT DESK BUKA SAAT BULAN NAIK</p>
        </section>

        <section class="login-card" aria-labelledby="login-title">
            <header class="login-card-header">
                <div class="logo-box"><span>MI</span></div>
                <div class="kicker">MONSTER INN</div>
                <h1 class="login-title" id="login-title">Portal Receptionist</h1>
                <p class="login-sub">Masukkan kunci staf untuk membuka front desk.</p>
            </header>

            <div th:if="${error != null}" class="alert-error">
                <p th:text="${error}">Akses ditolak.</p>
            </div>

            <div th:if="${logoutMsg != null}" class="alert-success">
                <p th:text="${logoutMsg}">Logout berhasil.</p>
            </div>

            <form th:action="@{/login}" method="post">
                <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}" />
                <div class="field-group">
                    <label for="username">ID Staf</label>
                    <input type="text" id="username" name="username" class="pixel-input"
