<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Pixelify+Sans:wght@400;700&family=Press+Start+2P&family=VT323&display=swap" rel="stylesheet">
    <title>Layanan Tamu — Monster Inn</title>
    <style>
        body { background: #0f0b14; color: #f4e8d0; font-family: 'Pixelify Sans', sans-serif; image-rendering: pixelated; }
        .pixel-card { background: #1e1825; border: 4px solid #3a2e28; box-shadow: 6px 6px 0px #000; }
        .text-pixel { font-family: 'Press Start 2P', monospace; }
        .text-retro { font-family: 'VT323', monospace; }
        
        .pixel-input { background: #050208; border: 3px solid #3a2e28; color: #f4e8d0; outline: none; }
        .pixel-input:focus { border-color: #ffd96b; }

        .service-item { border: 3px solid #3a2e28; transition: all 0.2s; }
        .service-item:hover { border-color: #ffd96b; transform: scale(1.02); }
    </style>
</head>
<body class="flex min-h-screen">

    <!-- IMPORT SIDEBAR[cite: 1] -->
    <div th:replace="~{layout/sidebar :: monster-sidebar}"></div>

    <!-- MAIN CONTENT -->
    <main class="flex-1 p-8 overflow-y-auto">
        <header class="mb-10 border-b-4 border-[#3a2e28] pb-6">
            <div class="text-[#c08800] text-xs text-pixel mb-2">✦ PERAWATAN SPESIFIK</div>
            <h2 class="text-pixel text-xl text-[#ffd96b]">LAYANAN TAMU</h2>
            <p class="text-retro text-xl text-[#9c7ac4] mt-1 italic">Berikan nutrisi tambahan untuk tamu monster Anda.</p>
        </header>

        <div class="grid grid-cols-12 gap-8">
            <!-- Seleksi Tamu -->
            <div class="col-span-4 space-y-6">
                <div class="pixel-card p-6">
                    <label class="text-pixel text-[8px] text-[#ffd96b] block mb-4 uppercase">Pilih Tamu Aktif</label>
                    <select id="guest-select" onchange="updateServices()" class="pixel-input w-full px-4 py-3 text-retro text-2xl appearance-none cursor-pointer">
                        <option value="">Pilih dari daftar...</option>
                        <option value="fire">Ember Blaze (#102)</option>
                        <option value="water">Wade Ripple (#202)</option>
                    </select>
                </div>

                <div id="summary-box" class="pixel-card p-6 hidden">
                    <p class="text-pixel text-[7px] text-[#9c7ac4] text-center mb-4 uppercase">Layanan Terpilih</p>
                    <ul id="selected-list" class="text-retro text-xl space-y-2 text-center"></ul>
                </div>
            </div>

            <!-- Daftar Layanan -->
            <div class="col-span-8">
                <div id="service-container" class="grid grid-cols-1 gap-4">
                    <div class="pixel-card p-20 text-center opacity-50">
                        <i class="fa-solid fa-mortar-pestle text-5xl mb-4 text-[#3a2e28]"></i>
                        <p class="text-pixel text-[8px]">Menunggu Seleksi Tamu...</p>
                    </div>
                </div>
            </div>
        </div>
    </main>

    <script>
        const services = {
            fire: [
                { name: "Magma Injection", price: 60000, icon: "fa-fire", color: "#e8734a" },
                { name: "Lava Bath", price: 75000, icon: "fa-hot-tub-person", color: "#e8734a" }
            ],
            water: [
                { name: "Aquatic Nutrient", price: 70000, icon: "fa-droplet", color: "#6ba3c5" },
                { name: "Deep Sea Mist", price: 45000, icon: "fa-cloud-showers-heavy", color: "#6ba3c5" }
            ]
        };

        function updateServices() {
            const el = document.getElementById('guest-select').value;
            const container = document.getElementById('service-container');
            const summary = document.getElementById('summary-box');
            
            if(!el) { 
                summary.classList.add('hidden');
                return; 
            }

            summary.classList.remove('hidden');
            container.innerHTML = services[el].map(s => `
                <div class="service-item bg-[#1e1825] p-6 flex justify-between items-center">
                    <div class="flex items-center gap-4">
                        <div class="w-12 h-12 border-2 border-[#3a2e28] flex items-center justify-center" style="color: ${s.color}">
                            <i class="fa-solid ${s.icon} text-2xl"></i>
                        </div>
                        <div>
                            <h4 class="text-retro text-2xl font-bold">${s.name}</h4>
                            <p class="text-retro text-lg text-[#9c7ac4]">Tarif: Rp ${s.price.toLocaleString()}</p>
                        </div>
                    </div>
                    <button class="px-4 py-2 bg-[#d4a94a] border-2 border-[#3a2e28] text-pixel text-[7px] hover:bg-[#ffd96b]">TAMBAH</button>
                </div>
            `).join('');
        }
    </script>
</body>
</html>
