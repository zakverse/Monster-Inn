<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <!-- Font Pixel dari Landing Page -->
    <link href="https://fonts.googleapis.com/css2?family=Pixelify+Sans:wght@400;700&family=Press+Start+2P&family=VT323&display=swap" rel="stylesheet">
    <title>Pixel Dashboard — Monster Inn</title>
    <style>
        body { 
            background: #0f0b14; 
            color: #f4e8d0; 
            font-family: 'Pixelify Sans', sans-serif; 
            image-rendering: pixelated; 
        }
        .pixel-card { 
            background: #1e1825; 
            border: 4px solid #3a2e28; 
            box-shadow: 6px 6px 0px #000; 
        }
        .text-pixel { font-family: 'Press Start 2P', monospace; }
        .text-retro { font-family: 'VT323', monospace; }
    </style>
</head>
<body class="flex min-h-screen">

    <!-- PEMANGGILAN SIDEBAR MENGGUNAKAN LAYOUT-->
    <div th:replace="~{layout/sidebar :: monster-sidebar}"></div>
    
    <!-- MAIN CONTENT -->
    <main class="flex-1 p-8 overflow-y-auto">
        <!-- Header Section -->
        <header class="mb-10 flex justify-between items-end border-b-4 border-[#3a2e28] pb-6">
            <div>
                <h2 class="text-pixel text-xl text-[#ffd96b] tracking-wider uppercase">Overview Gua</h2>
                <p class="text-retro text-xl text-[#9c7ac4] mt-2">Selamat datang di terminal penginapan isekai anda.</p>
            </div>
            <div class="text-right text-[#d4a94a]">
                <p class="text-[10px] text-pixel uppercase">Isekai Time</p>
                <p class="text-retro text-2xl" th:text="${#calendars.format(#calendars.createNow(), 'EEEE, dd MMMM yyyy')}">Sunday, May 3, 2026</p>
            </div>
        </header>

        <!-- Stats Cards ala RPG UI -->
        <div class="grid grid-cols-4 gap-6 mb-10">
            <div class="pixel-card p-6">
                <p class="text-pixel text-[8px] text-[#9c7ac4] uppercase mb-3">Total Kamar</p>
                <p class="text-pixel text-2xl font-bold">09</p>
            </div>
            <div class="pixel-card p-6 border-b-4 border-b-[#85a67a]">
                <p class="text-pixel text-[8px] text-[#85a67a] uppercase mb-3">Tersedia</p>
                <p class="text-pixel text-2xl text-[#b5d4a8]">05</p>
            </div>
            <div class="pixel-card p-6 border-b-4 border-b-[#e8734a]">
                <p class="text-pixel text-[8px] text-[#e8734a] uppercase mb-3">Terisi</p>
                <p class="text-pixel text-2xl text-[#ffb570]">03</p>
            </div>
            <div class="pixel-card p-6 border-b-4 border-b-[#ffd96b]">
                <p class="text-pixel text-[8px] text-[#ffd96b] uppercase mb-3">HP / Occupancy</p>
                <p class="text-pixel text-xl uppercase">33.3%</p>
            </div>
        </div>

        <!-- Tabel Tamu Terkini -->
        <div class="pixel-card overflow-hidden">
            <div class="bg-[#3a2e28] p-4 border-b-4 border-[#000]">
                <h3 class="text-pixel text-[10px] text-[#ffd96b]">PENGHUNI SAAT INI</h3>
            </div>
            <table class="w-full text-left text-retro text-xl">
                <thead class="bg-[#0f0b14]/50 text-[#9c7ac4] border-b-2 border-[#3a2c1c]">
                    <tr>
                        <th class="px-6 py-4">NAMA TAMU</th>
                        <th class="px-6 py-4">ELEMEN</th>
                        <th class="px-6 py-4">NO. KAMAR</th>
                        <th class="px-6 py-4 text-right">STATUS</th>
                    </tr>
                </thead>
                <tbody class="divide-y-2 divide-[#3a2c1c]">
                    <tr class="hover:bg-[#3a2e28]/30 transition-all">
                        <td class="px-6 py-4 font-bold text-[#f4e8d0]">Ember Blaze</td>
                        <td class="px-6 py-4 text-[#e8734a]">FIRE</td>
                        <td class="px-6 py-4">#102</td>
                        <td class="px-6 py-4 text-right">
                            <span class="px-3 py-1 bg-[#85a67a]/20 text-[#85a67a] border-2 border-[#85a67a]">ACTIVE</span>
                        </td>
                    </tr>
                    <tr class="hover:bg-[#3a2e28]/30 transition-all">
                        <td class="px-6 py-4 font-bold text-[#f4e8d0]">Wade Ripple</td>
                        <td class="px-6 py-4 text-[#6ba3c5]">WATER</td>
                        <td class="px-6 py-4">#202</td>
                        <td class="px-6 py-4 text-right">
                            <span class="px-3 py-1 bg-[#85a67a]/20 text-[#85a67a] border-2 border-[#85a67a]">ACTIVE</span>
                        </td>
                    </tr>
                </tbody>
            </table>
        </div>
    </main>
</body>
</html>
