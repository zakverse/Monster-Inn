<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Pixelify+Sans:wght@400;700&family=Press+Start+2P&family=VT323&display=swap" rel="stylesheet">
    <title>Status Habitat — Monster Inn</title>
    <style>
        body { background: #0f0b14; color: #f4e8d0; font-family: 'Pixelify Sans', sans-serif; image-rendering: pixelated; }
        .pixel-card { background: #1e1825; border: 4px solid #3a2e28; box-shadow: 6px 6px 0px #000; }
        .text-pixel { font-family: 'Press Start 2P', monospace; }
        .text-retro { font-family: 'VT323', monospace; }
        
        .pixel-scroll::-webkit-scrollbar { height: 8px; }
        .pixel-scroll::-webkit-scrollbar-track { background: #1e1825; border: 2px solid #3a2e28; }
        .pixel-scroll::-webkit-scrollbar-thumb { background: #d4a94a; border: 1px solid #000; }
        
        .room-box { min-width: 240px; border: 4px solid #3a2e28; transition: all 0.2s; position: relative; }
        .room-box:hover { transform: translateY(-4px); border-color: #ffd96b; z-index: 10; }
        
        .status-tag { position: absolute; top: 0; right: 0; font-size: 8px; padding: 4px 8px; border-left: 4px solid #3a2e28; border-bottom: 4px solid #3a2e28; }
    </style>
</head>
<body class="flex min-h-screen">

    <div th:replace="~{layout/sidebar :: monster-sidebar}"></div>

    <main class="flex-1 p-8 overflow-x-hidden">
        <header class="mb-10 border-b-4 border-[#3a2e28] pb-6 flex justify-between items-center">
            <div>
                <div class="text-[#c08800] text-xs text-pixel mb-2 uppercase">✦ Monitoring Habitat</div>
                <h2 class="text-pixel text-xl text-[#ffd96b]">STATUS KAMAR</h2>
            </div>
            
            <div class="pixel-card p-4 flex gap-6 text-retro text-lg uppercase tracking-widest bg-[#050208]">
                <div class="flex items-center gap-2"><span class="w-3 h-3 bg-[#85a67a]"></span> READY</div>
                <div class="flex items-center gap-2"><span class="w-3 h-3 bg-[#e8734a]"></span> TERISI</div>
                <div class="flex items-center gap-2"><span class="w-3 h-3 bg-gray-600"></span> KOTOR</div>
            </div>
        </header>

        <section class="mb-12">
            <h3 class="text-pixel text-[10px] text-[#e8734a] mb-6 flex items-center gap-3">
                <i class="fa-solid fa-fire text-lg"></i> KLAN API (FIRE ZONE)
            </h3>
            <div class="flex gap-6 overflow-x-auto pb-6 pixel-scroll">
                <div th:each="room : ${fireRooms}" class="room-box p-5"
                     th:classappend="${room.status.name() == 'OCCUPIED' ? 'bg-[#2a1210] border-[#e8734a]' : (room.status.name() == 'DIRTY' ? 'bg-[#1a1a1a] opacity-70' : 'bg-[#181210]')}">
                    
                    <div class="status-tag font-bold" th:text="${room.status.label}"
                         th:classappend="${room.status.name() == 'OCCUPIED' ? 'bg-[#e8734a] text-white' : (room.status.name() == 'DIRTY' ? 'bg-gray-700 text-gray-400' : 'bg-[#85a67a] text-black')}">
                    </div>

                    <div class="text-pixel text-[8px] mb-4" th:text="'#' + ${room.roomId}"
                         th:classappend="${room.status.name() == 'OCCUPIED' ? 'text-[#ffb570]' : 'text-[#3a2e28]'}"></div>
                    
                    <div class="flex justify-center my-6" th:switch="${room.status.name()}">
                        <i th:case="'OCCUPIED'" class="fa-solid fa-dragon text-5xl text-[#ffb570]"></i>
                        <i th:case="'DIRTY'" class="fa-solid fa-broom text-5xl text-gray-500"></i>
                        <i th:case="*" class="fa-solid fa-volcano text-5xl text-[#3a2e28]"></i>
                    </div>

                    <div class="border-t-2 border-[#3a2e28] pt-3 text-center">
                        <p class="text-retro text-2xl font-bold">Lava Suite</p>
                        <p th:if="${room.currentGuest != null}" class="text-retro text-xl text-[#ffd96b]" th:text="${room.currentGuest.name}"></p>
                        <p th:unless="${room.currentGuest != null}" class="text-retro text-lg text-gray-600 italic">READY</p>
                    </div>
                </div>
            </div>
        </section>

        <section class="mb-12">
            <h3 class="text-pixel text-[10px] text-[#6ba3c5] mb-6 flex items-center gap-3">
                <i class="fa-solid fa-droplet text-lg"></i> KLAN AIR (WATER ZONE)
            </h3>
            <div class="flex gap-6 overflow-x-auto pb-6 pixel-scroll">
                <div th:each="room : ${waterRooms}" class="room-box p-5"
                     th:classappend="${room.status.name() == 'OCCUPIED' ? 'bg-[#0a1f2e] border-[#6ba3c5]' : (room.status.name() == 'DIRTY' ? 'bg-[#1a1a1a] opacity-70' : 'bg-[#051a2a]')}">
                    
                    <div class="status-tag font-bold" th:text="${room.status.label}"
                         th:classappend="${room.status.name() == 'OCCUPIED' ? 'bg-[#e8734a] text-white' : (room.status.name() == 'DIRTY' ? 'bg-gray-700 text-gray-400' : 'bg-[#85a67a] text-black')}">
                    </div>

                    <div class="text-pixel text-[8px] mb-4" th:text="'#' + ${room.roomId}"
                         th:classappend="${room.status.name() == 'OCCUPIED' ? 'text-[#9cd4ee]' : 'text-[#3a6d8f]'}"></div>
                    
                    <div class="flex justify-center my-6" th:switch="${room.status.name()}">
                        <i th:case="'OCCUPIED'" class="fa-solid fa-dragon text-5xl text-[#9cd4ee]"></i>
                        <i th:case="'DIRTY'" class="fa-solid fa-broom text-5xl text-gray-500"></i>
                        <i th:case="*" class="fa-solid fa-water-ripple text-5xl text-[#3a6d8f]"></i>
                    </div>

                    <div class="border-t-2 border-[#3a6d8f] pt-3 text-center">
                        <p class="text-retro text-2xl font-bold">Coral Reef</p>
                        <p th:if="${room.currentGuest != null}" class="text-retro text-xl text-[#ffd96b]" th:text="${room.currentGuest.name}"></p>
                        <p th:unless="${room.currentGuest != null}" class="text-retro text-lg text-gray-600 italic">READY</p>
                    </div>
                </div>
            </div>
        </section>

        <section class="mb-12">
            <h3 class="text-pixel text-[10px] text-[#85a67a] mb-6 flex items-center gap-3">
                <i class="fa-solid fa-mountain text-lg"></i> KLAN TANAH (EARTH ZONE)
            </h3>
            <div class="flex gap-6 overflow-x-auto pb-6 pixel-scroll">
                <div th:each="room : ${earthRooms}" class="room-box p-5"
                     th:classappend="${room.status.name() == 'OCCUPIED' ? 'bg-[#1a2418] border-[#85a67a]' : (room.status.name() == 'DIRTY' ? 'bg-[#1a1a1a] opacity-70' : 'bg-[#0a1805]')}">
                    
                    <div class="status-tag font-bold" th:text="${room.status.label}"
                         th:classappend="${room.status.name() == 'OCCUPIED' ? 'bg-[#e8734a] text-white' : (room.status.name() == 'DIRTY' ? 'bg-gray-700 text-gray-400' : 'bg-[#85a67a] text-black')}">
                    </div>

                    <div class="text-pixel text-[8px] mb-4" th:text="'#' + ${room.roomId}"
                         th:classappend="${room.status.name() == 'OCCUPIED' ? 'text-[#b5d4a8]' : 'text-[#5d8050]'}"></div>
                    
                    <div class="flex justify-center my-6" th:switch="${room.status.name()}">
                        <i th:case="'OCCUPIED'" class="fa-solid fa-dragon text-5xl text-[#b5d4a8]"></i>
                        <i th:case="'DIRTY'" class="fa-solid fa-broom text-5xl text-gray-500"></i>
                        <i th:case="*" class="fa-solid fa-tree text-5xl text-[#5d8050]"></i>
                    </div>

                    <div class="border-t-2 border-[#5d8050] pt-3 text-center">
                        <p class="text-retro text-2xl font-bold">Terra Lodge</p>
                        <p th:if="${room.currentGuest != null}" class="text-retro text-xl text-[#ffd96b]" th:text="${room.currentGuest.name}"></p>
                        <p th:unless="${room.currentGuest != null}" class="text-retro text-lg text-gray-600 italic">READY</p>
                    </div>
                </div>
            </div>
        </section>
    </main>
</body>
</html>
