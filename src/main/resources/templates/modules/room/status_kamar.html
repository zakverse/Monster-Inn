<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Pixelify+Sans:wght@400;700&family=Press+Start+2P&family=VT323&display=swap" rel="stylesheet">
    <title>Status Habitat — Monster Inn</title>
    <style>
        body { background: #0f0b14; color: #f4e8d0; font-family: 'Pixelify Sans', sans-serif; image-rendering: pixelated; }
        .pixel-card { background: #1e1825; border: 4px solid #3a2e28; box-shadow: 6px 6px 0px #000; }
        .text-pixel { font-family: 'Press Start 2P', monospace; }
        .text-retro { font-family: 'VT323', monospace; }
        
        /* Custom Scrollbar untuk Pixel Art */
        .pixel-scroll::-webkit-scrollbar { height: 8px; }
        .pixel-scroll::-webkit-scrollbar-track { background: #1e1825; border: 2px solid #3a2e28; }
        .pixel-scroll::-webkit-scrollbar-thumb { background: #d4a94a; border: 1px solid #000; }
        
        .room-box { min-width: 220px; border: 4px solid #3a2e28; transition: all 0.2s; position: relative; }
        .room-box:hover { transform: translateY(-4px); border-color: #ffd96b; z-index: 10; }
        
        .status-tag { position: absolute; top: 0; right: 0; font-size: 8px; padding: 4px 8px; border-left: 4px solid #3a2e28; border-bottom: 4px solid #3a2e28; }
    </style>
</head>
<body class="flex min-h-screen">

    <!-- IMPORT SIDEBAR -->
    <div th:replace="~{layout/sidebar :: monster-sidebar}"></div>

    <main class="flex-1 p-8 overflow-x-hidden">
        <header class="mb-10 border-b-4 border-[#3a2e28] pb-6 flex justify-between items-center">
            <div>
                <div class="text-[#c08800] text-xs text-pixel mb-2 uppercase">✦ Monitoring Habitat</div>
                <h2 class="text-pixel text-xl text-[#ffd96b]">STATUS KAMAR</h2>
            </div>
            
            <div class="pixel-card p-4 flex gap-6 text-retro text-lg uppercase tracking-widest bg-[#050208]">
                <div class="flex items-center gap-2"><span class="w-3 h-3 bg-[#85a67a] border border-black"></span> Tersedia</div>
                <div class="flex items-center gap-2"><span class="w-3 h-3 bg-[#e8734a] border border-black"></span> Terisi</div>
            </div>
        </header>

        <!-- KLAN API (7 KAMAR) -->
        <section class="mb-12">
            <h3 class="text-pixel text-[10px] text-[#e8734a] mb-6 flex items-center gap-3">
                <i class="fa-solid fa-fire"></i> KLAN API (FIRE ZONE)
            </h3>
            <div class="flex gap-6 overflow-x-auto pb-6 pixel-scroll">
                <!-- Gunakan th:each jika sudah ada data dari database -->
                <div th:each="i : ${#numbers.sequence(1, 7)}" class="room-box bg-[#181210] p-5">
                    <div class="status-tag bg-[#85a67a] text-black font-bold">READY</div>
                    <div class="text-pixel text-[8px] text-[#3a2e28] mb-4">#10[(${i})]</div>
                    <div class="flex justify-center my-6">
                        <i class="fa-solid fa-volcano text-5xl text-[#3a2e28]"></i>
                    </div>
                    <div class="border-t-2 border-[#3a2e28] pt-3">
                        <p class="text-retro text-2xl font-bold">Lava Suite [(${i})]</p>
                    </div>
                </div>
            </div>
        </section>

        <!-- KLAN AIR (7 KAMAR) -->
        <section class="mb-12">
            <h3 class="text-pixel text-[10px] text-[#6ba3c5] mb-6 flex items-center gap-3">
                <i class="fa-solid fa-droplet"></i> KLAN AIR (WATER ZONE)
            </h3>
            <div class="flex gap-6 overflow-x-auto pb-6 pixel-scroll">
                <div th:each="i : ${#numbers.sequence(1, 7)}" class="room-box bg-[#051a2a] p-5 border-[#6ba3c5]">
                    <div class="status-tag bg-[#e8734a] text-white font-bold">OCCUPIED</div>
                    <div class="text-pixel text-[8px] text-[#3a6d8f] mb-4">#20[(${i})]</div>
                    <div class="flex justify-center my-6">
                        <i class="fa-solid fa-dragon text-5xl text-[#6ba3c5]"></i>
                    </div>
                    <div class="border-t-2 border-[#3a6d8f] pt-3">
                        <p class="text-retro text-2xl font-bold">Coral Reef [(${i})]</p>
                    </div>
                </div>
            </div>
        </section>

        <!-- KLAN TANAH (7 KAMAR) -->
        <section class="mb-12">
            <h3 class="text-pixel text-[10px] text-[#85a67a] mb-6 flex items-center gap-3">
                <i class="fa-solid fa-mountain"></i> KLAN TANAH (EARTH ZONE)
            </h3>
            <div class="flex gap-6 overflow-x-auto pb-6 pixel-scroll">
                <div th:each="i : ${#numbers.sequence(1, 7)}" class="room-box bg-[#0a1805] p-5">
                    <div class="status-tag bg-[#85a67a] text-black font-bold">READY</div>
                    <div class="text-pixel text-[8px] text-[#5d8050] mb-4">#30[(${i})]</div>
                    <div class="flex justify-center my-6">
                        <i class="fa-solid fa-tree text-5xl text-[#5d8050]"></i>
                    </div>
                    <div class="border-t-2 border-[#5d8050] pt-3">
                        <p class="text-retro text-2xl font-bold">Terra Lodge [(${i})]</p>
                    </div>
                </div>
            </div>
        </section>
    </main>

</body>
</html>
