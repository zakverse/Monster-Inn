<!DOCTYPE html>
<html lang="id" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login Resepsionis — Monster Inn</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&family=VT323&family=Pixelify+Sans:wght@400..700&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Pixelify Sans', sans-serif;
            background: #0f0b14; /* --bg-night */
            color: #f4e8d0; /* --parchment */
            image-rendering: pixelated;
        }
        .text-pixel { font-family: 'Press Start 2P', monospace; }
        .text-retro { font-family: 'VT323', monospace; }
        
        .pixel-card {
            background: #1e1825; /* --bg-deep */
            border: 5px solid #3a2e28; /* --wood-dark */
            box-shadow: 8px 8px 0 rgba(0,0,0,0.5);
        }
        
        .pixel-input {
            background: #050208; /* --bg-darker */
            border: 3px solid #3a2e28;
            color: #f4e8d0;
            outline: none;
            transition: all 0.2s;
        }
        .pixel-input:focus {
            border-color: #ffd96b; /* --gold-bright */
            box-shadow: 4px 4px 0 rgba(212,169,74,0.2);
        }

        .btn-pixel {
            background: #d4a94a; /* --gold */
            color: #3a2e28;
            border: 4px solid #3a2e28;
            box-shadow: 4px 4px 0 rgba(0,0,0,0.3);
            text-shadow: 1px 1px 0 rgba(255,255,255,0.3);
        }
        .btn-pixel:hover {
            background: #ffd96b;
            transform: translate(-2px, -2px);
            box-shadow: 6px 6px 0 rgba(0,0,0,0.3);
        }
        .btn-pixel:active {
            transform: translate(2px, 2px);
            box-shadow: 1px 1px 0 rgba(0,0,0,0.3);
        }

        /* Bintang berkedip seperti di landing page */
        .stars {
            position: fixed; inset: 0; pointer-events: none;
            background-image: radial-gradient(2px 2px at 20% 30%, #ffd96b, transparent),
                              radial-gradient(1px 1px at 80% 70%, #fff, transparent);
            animation: twinkle 4s infinite ease-in-out;
        }
        @keyframes twinkle { 0%, 100% { opacity: 0.3; } 50% { opacity: 0.8; } }
    </style>
</head>
<body class="min-h-screen flex items-center justify-center p-4">

    <div class="stars"></div>

    <div class="pixel-card w-full max-w-md p-10 relative z-10">
        
        <!-- Header -->
        <div class="text-center mb-10">
            <div class="inline-block p-3 border-2 border-[#ffd96b] bg-[#050208] mb-4">
                <span class="text-[#ffd96b] text-pixel text-xl">M</span>
            </div>
            <h2 class="text-pixel text-sm text-[#ffd96b] tracking-widest leading-relaxed">
                MONSTER <span class="text-[#9c7ac4]">INN</span>
            </h2>
            <p class="text-retro text-2xl text-[#9c7ac4] mt-2">Portal Resepsionis</p>
        </div>

        <!-- Form Login -->
        <form th:action="@{/login}" method="post" class="space-y-6">
            
            <div>
                <label for="username" class="text-retro text-xl text-[#d4c298] block mb-2 uppercase tracking-wider">ID Staf</label>
                <input type="text" id="username" name="username" required
                    class="pixel-input w-full px-4 py-3 text-lg"
                    placeholder="Masukkan username...">
            </div>

            <div>
                <label for="password" class="text-retro text-xl text-[#d4c298] block mb-2 uppercase tracking-wider">Kunci Akses</label>
                <input type="password" id="password" name="password" required
                    class="pixel-input w-full px-4 py-3 text-lg"
                    placeholder="Masukkan password...">
            </div>

            <!-- Pesan Error -->
            <div th:if="${param.error}" class="bg-red-900/30 border-2 border-red-500 p-3 text-center">
                <p class="text-retro text-lg text-red-400 uppercase">Gagal: Akses Ditolak!</p>
            </div>

            <button type="submit" class="btn-pixel w-full py-4 text-pixel text-[10px] tracking-tighter uppercase transition-all">
                Masuk Penginapan ▶
            </button>
        </form>

        <!-- Footer -->
        <div class="mt-10 text-center border-t-2 border-[#3a2e28] pt-6">
            <a href="/" class="text-retro text-xl text-[#9c7ac4] hover:text-[#ffd96b] transition-colors">
                &larr; Kembali ke Lobi Utama
            </a>
        </div>
    </div>

</body>
</html>
